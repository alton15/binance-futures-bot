[project]
name = "binance-futures-bot"
version = "0.1.0"
description = "Technical analysis based Binance USDT-M futures trading bot"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.5.92",  # Algo Order API routing (Binance 2025-12 change)
    "pandas>=2.0.0",
    "pandas-ta>=0.3.14b",  # PyPI releases now require Python >= 3.12 (Docker uses 3.12)
    "rank-bm25>=0.2.2",  # legacy swing bot situation memory
    "numpy>=1.24.0",
    "aiosqlite>=0.19.0",
    "apscheduler>=3.10.0",
    "websockets>=14.0",  # new asyncio client API
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "numba>=0.60",  # trend signals (runtime, not only backtests)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
futuresbot = "src.main:main"
scalper = "src.scalper.__main__:main"
trend = "src.trend.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "config*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
